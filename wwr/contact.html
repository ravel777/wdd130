        <main>
           <div class="info">
            <h2>Contact Us</h2>
            <ul>
                <li><span>Adress: </span>M.NGOUABI Street, Pointe-Noire</li>
                <li><span>Phone number: </span>(+242) 06 879 49 42</li>
                <li><span>Email: </span>info@raftinginpn.com</li>
                <li><iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d5787.444081014285!2d11.873749405040924!3d-4.797508558267166!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2scg!4v1730013920255!5m2!1sen!2scg" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></li>
            </ul>
           </div>
           <h2>Come to enjoy rafting with our team</h2>
           <div class="caption">
            <br>
            <figure>
                <img src="images/employee1.jpeg" alt="">
                <figcaption> Marco Suarez</figcaption>
            </figure>
            <figure>
                <img src="images/employee2.jpeg" alt="">
                <figcaption>John Bill</figcaption>
            </figure>
            <figure>
                <img src="images/employee4.webp" alt="">
                <figcaption>Linda Pull</figcaption>
            </figure>
           </div>
           <div class="form">
            <form action="#" method="POST">
                <fieldset>
                    <legend>Enter the following</legend>
                    <div class="inputs">
                        <label for="username">Username </label><input type="text" id="username">
                    </div>
                    <div class="inputs">
                        <label for="email">Email </label><input type="text" id="email">
                    </div>
                    <div class="radio">
                        <label for="general">General Inquiry </label><input type="radio" id="general" name="purpose">
                        <label for="reservation">Reservation Question </label><input type="radio" id="reservation" name="purpose">
                        <label for="website">Website </label><input type="radio" id="website" name="purpose">
                    </div>
                    <div class="area">
                        <label for="message">Message</label>
                        <textarea name="message" id="message" placeholder="Enter a message"></textarea>
                    </div>
                    <div class="check">
                        <label for="monthly">Please subscribe me to monthly newsletter </label><input type="checkbox" id="monthly">
                    </div>
                    <div class="button">
                        <input type="submit" value="Send">
                    </div>
                </fieldset>
            </form>
           </div>
        </main>
